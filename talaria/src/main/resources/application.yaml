server:
  port: 8080

talaria:
  aiBaseUrl: "http://127.0.0.1:8000"
  sessionTtlSeconds: 600

cors:
  allowed-origins: "http://localhost:3000,http://127.0.0.1:3000"
livekit:
  # 클라이언트(WebRTC) 접속용
  wsUrl: "wss://<your-project>.livekit.cloud"   # self-host면 wss://<host>:<port>
  # 서버 API(RoomService 등) 호출용
  apiUrl: "https://<your-project>.livekit.cloud" # self-host면 http(s)://<host>:<port>
  apiKey: "${LIVEKIT_API_KEY}"
  apiSecret: "${LIVEKIT_API_SECRET}"
