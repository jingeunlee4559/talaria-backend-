spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  address: 0.0.0.0
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

talaria:
  aiBaseUrl: "http://127.0.0.1:8000"
  sessionTtlSeconds: 60
  summarizeUrl: ${TALARIA_SUMMARIZE_URL:}
  files:
    frontPublicRoot: "C:/workspace/gitaction_assignment/talaria-frontend/public"
    cultureThumbBaseDir: "/img"

livekit:
  wsUrl: "${LIVEKIT_WS_URL:${LIVEKIT_URL}}"
  apiUrl: "${LIVEKIT_API_URL:${LIVEKIT_URL}}"
  apiKey: "${LIVEKIT_API_KEY}"
  apiSecret: "${LIVEKIT_API_SECRET}"

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  level:
    org.apache.ibatis: TRACE
    org.mybatis.spring.SqlSessionUtils: DEBUG
    org.springframework.jdbc.core: DEBUG

storage:
  documents:
    root: ${DOC_STORAGE_ROOT:./data/uploads/docs}
  transdocs:
    root: ${DOC_STORAGE_ROOT:./data/uploads/transdocs}

papago:
  client-id: ${PAPAGO_CLIENT_ID:}
  client-secret: ${PAPAGO_CLIENT_SECRET:}
  n2mt-url: https://openapi.naver.com/v1/papago/n2mtwa

