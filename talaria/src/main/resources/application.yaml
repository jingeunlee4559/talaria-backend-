spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  address: 0.0.0.0     
  port: 8080

talaria:
  aiBaseUrl: "https://127.0.0.1:8000"
  sessionTtlSeconds: 60

cors:
  # React 서버 IP를 명시 (다른 PC에서도 접속 가능)
  # 예: 개발 PC IP가 192.168.0.15라면
  allowed-origins: "https://192.168.70.154:3000,https://localhost:3000,https://127.0.0.1:3000"

livekit:
  wsUrl: "${LIVEKIT_WS_URL:${LIVEKIT_URL}}"
  apiUrl: "${LIVEKIT_API_URL:${LIVEKIT_URL}}"
  apiKey: "${LIVEKIT_API_KEY}"
  apiSecret: "${LIVEKIT_API_SECRET}"
